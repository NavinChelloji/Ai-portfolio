<!-- FAB -->
<button class="chat-fab" (click)="toggleChat()" title="Chat with AI about Naveen">
  {{ isOpen ? '✕' : '💬' }}
</button>

<!-- Chatbot Panel -->
<div class="chatbot" [class.open]="isOpen">

  <!-- Header -->
  <div class="chat-header">
    <div class="chat-avatar">🤖</div>
    <div>
      <div class="chat-hname">Ask about Naveen</div>
      <div class="chat-hsub">AI Assistant • Powered by Claude</div>
    </div>
    <button class="chat-close" (click)="toggleChat()">✕</button>
  </div>

  <!-- Messages -->
  <div class="chat-messages" id="chat-messages">
    <div
      *ngFor="let msg of messages"
      class="msg"
      [ngClass]="msg.role === 'user' ? 'user' : 'bot'"
    >
      {{ msg.text }}
    </div>

    <!-- Typing indicator -->
    <div class="msg bot typing" *ngIf="isLoading">
      <div class="typing-dots">
        <span></span><span></span><span></span>
      </div>
    </div>
  </div>

  <!-- Suggestions -->
  <div class="chat-suggestions" *ngIf="showSuggestions">
    <button
      class="sug-btn"
      *ngFor="let s of suggestions"
      (click)="sendSuggestion(s)"
    >
      {{ s }}
    </button>
  </div>

  <!-- Input -->
  <div class="chat-input-row">
    <textarea
      class="chat-input"
      [(ngModel)]="userInput"
      (keydown)="onKeyDown($event)"
      placeholder="Ask about Naveen..."
      rows="1"
    ></textarea>
    <button class="chat-send" (click)="send()" [disabled]="isLoading">➤</button>
  </div>
</div>
